<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | JobPortal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="design_system.css">
    <link rel="stylesheet" href="auth_style.css">
    <link rel="stylesheet" href="register_style.css">
</head>
<body class="auth-page">
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"></button>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-logo">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p>Join JobPortal and find your dream job</p>
            </div>

            <form id="registerForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            id="fullName" 
                            class="form-input" 
                            placeholder="John Doe"
                            autocomplete="name"
                            aria-label="Full name"
                        >
                    </div>
                    <span class="error-message hidden" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="you@example.com"
                            autocomplete="email"
                            aria-label="Email address"
                        >
                    </div>
                    <span class="error-message hidden" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number <span class="optional">(optional)</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-phone"></i>
                        <input 
                            type="tel" 
                            id="phone" 
                            class="form-input" 
                            placeholder="+1 (555) 000-0000"
                            autocomplete="tel"
                            aria-label="Phone number"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            aria-label="Password"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message hidden" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="form-input" 
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            aria-label="Confirm password"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            id="toggleConfirmPassword"
                            aria-label="Show confirm password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message hidden" id="confirmPasswordError"></span>
                </div>

                <div class="password-strength hidden" id="passwordStrength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthBar"></div>
                    </div>
                    <span class="strength-label" id="strengthLabel"></span>
                </div>

                <div class="general-error hidden" id="generalError"></div>
                <div class="success-message hidden" id="successMessage"></div>

                <button type="submit" id="registerButton" class="btn btn-primary btn-block btn-lg">
                    <span id="buttonText">Create Account</span>
                    <span id="loadingSpinner" class="spinner-inline hidden"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="Login.html" class="link-primary">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script src="register.js"></script>
</body>
</html>
