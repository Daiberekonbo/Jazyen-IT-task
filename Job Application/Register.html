<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="register_style.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
    <a href="LandingPage2.html" class="back-arrow" title="back-arrow"><i class="glyphicon glyphicon-arrow-left"></i></a>
    <div id="container">
        <div id="image">
            <img src="images.jpg" alt="Job Application">
        </div>
        <div id="frm">
            <form id="registerForm" novalidate>
                <h4>Create Account</h4>

                <!-- ============================================================
                FULL NAME FIELD
                We need the user's full name for their profile.
                ============================================================ -->
                <fieldset>
                    <legend><i class="glyphicon glyphicon-user"></i>Full Name:</legend>
                    <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
                    <p id="nameError" class="error-message"></p>
                </fieldset>

                <!-- ============================================================
                EMAIL FIELD
                ============================================================ -->
                <fieldset>
                    <legend><i class="glyphicon glyphicon-envelope"></i>Email:</legend>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                    <p id="emailError" class="error-message"></p>
                </fieldset>

                <!-- ============================================================
                PASSWORD FIELD
                With show/hide toggle and strength indicator.
                ============================================================ -->
                <fieldset class="password-field">
                    <legend><i class="glyphicon glyphicon-lock"></i>Password:</legend>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Create a password">
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
                            <span class="glyphicon glyphicon-eye-open"></span>
                        </button>
                    </div>
                    <!-- Password strength bar -->
                    <div id="passwordStrength" class="password-strength">
                        <div id="strengthBar" class="strength-bar"></div>
                    </div>
                    <!-- Password requirements list -->
                    <ul id="passwordRequirements" class="password-requirements">
                        <li id="reqLength">At least 8 characters</li>
                        <li id="reqUppercase">At least 1 uppercase letter</li>
                        <li id="reqLowercase">At least 1 lowercase letter</li>
                        <li id="reqNumber">At least 1 number</li>
                        <li id="reqSpecial">At least 1 special character (!@#$%^&*)</li>
                    </ul>
                    <p id="passwordError" class="error-message"></p>
                </fieldset>

                <!-- ============================================================
                CONFIRM PASSWORD FIELD
                Users must type their password again to avoid typos.
                ============================================================ -->
                <fieldset class="password-field">
                    <legend><i class="glyphicon glyphicon-lock"></i>Confirm Password:</legend>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                        <button type="button" id="toggleConfirmPassword" class="toggle-password" aria-label="Show password">
                            <span class="glyphicon glyphicon-eye-open"></span>
                        </button>
                    </div>
                    <p id="confirmPasswordError" class="error-message"></p>
                </fieldset>

                <!-- ============================================================
                GENERAL ERROR & SUCCESS MESSAGES
                ============================================================ -->
                <div id="generalError" class="error-message general-error"></div>
                <div id="successMessage" class="success-message"></div>

                <!-- ============================================================
                REGISTER BUTTON
                ============================================================ -->
                <button type="button" id="registerButton" class="register-button">
                    <span id="buttonText">Create Account</span>
                    <span id="loadingSpinner" class="spinner hidden">
                        <span class="glyphicon glyphicon-refresh spinning"></span>
                    </span>
                </button>

                <p>Already have an account? <a href="Login.html">Login here</a></p>
            </form>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
