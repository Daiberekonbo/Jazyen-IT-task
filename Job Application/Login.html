<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobPortal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="design_system.css">
    <link rel="stylesheet" href="login_style.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-logo">
                    <i class="fas fa-briefcase"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to your JobPortal account</p>
            </div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="you@example.com"
                            autocomplete="email"
                            aria-label="Email address"
                        >
                    </div>
                    <span class="error-message hidden" id="emailError"></span>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="ForgotPassword.html" class="forgot-link">Forgot password?</a>
                    </div>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            aria-label="Password"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message hidden" id="passwordError"></span>
                </div>

                <div class="form-group form-check">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkbox-custom"></span>
                        Remember me
                    </label>
                </div>

                <div class="general-error hidden" id="generalError"></div>
                <div class="success-message hidden" id="successMessage"></div>

                <button type="submit" id="loginButton" class="btn btn-primary btn-block btn-lg">
                    <span id="buttonText">Sign In</span>
                    <span id="loadingSpinner" class="spinner-inline hidden"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="Register.html" class="link-primary">Create one</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
