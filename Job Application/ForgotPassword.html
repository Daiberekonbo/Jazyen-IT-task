<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgot_password_style.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
    <a href="LandingPage2.html" class="back-arrow" title="back-arrow"><i class="glyphicon glyphicon-arrow-left"></i></a>
    <div id="container">
        <div id="image">
            <img src="images.jpg" alt="Job Application">
        </div>
        <div id="frm">
            <form id="forgotPasswordForm" novalidate>
                <h4>Forgot Password</h4>
                <p class="form-description">Enter your email address and we'll send you a link to reset your password.</p>

                <fieldset>
                    <legend><i class="glyphicon glyphicon-envelope"></i>Email:</legend>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                    <p id="emailError" class="error-message"></p>
                </fieldset>

                <div id="generalError" class="error-message general-error"></div>
                <div id="successMessage" class="success-message"></div>

                <button type="button" id="resetButton" class="reset-button">
                    <span id="buttonText">Send Reset Link</span>
                    <span id="loadingSpinner" class="spinner hidden">
                        <span class="glyphicon glyphicon-refresh spinning"></span>
                    </span>
                </button>

                <p><a href="Login.html">Back to Login</a></p>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="forgot_password.js"></script>
</body>
</html>
