<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | JobPortal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="design_system.css">
    <link rel="stylesheet" href="auth_style.css">
    <link rel="stylesheet" href="login_style.css">
</head>
<body class="auth-page">
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"></button>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-logo">
                    <i class="fas fa-envelope"></i>
                </div>
                <h1>Forgot Password</h1>
                <p>Enter your email and we'll send a reset link</p>
            </div>

            <form id="forgotPasswordForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" aria-label="Email address">
                    </div>
                    <span class="error-message hidden" id="emailError"></span>
                </div>

                <div id="generalError" class="general-error hidden"></div>
                <div id="successMessage" class="success-message hidden"></div>

                <button type="button" id="resetButton" class="btn btn-primary btn-block btn-lg">
                    <span id="buttonText">Send Reset Link</span>
                    <span id="loadingSpinner" class="spinner-inline hidden"><i class="fas fa-spinner fa-spin"></i></span>
                </button>

                <div class="auth-footer">
                    <p><a href="Login.html" class="link-primary">Back to Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script src="forgot_password.js"></script>
</body>
</html>
