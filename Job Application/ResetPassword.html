<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | JobPortal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="design_system.css">
    <link rel="stylesheet" href="auth_style.css">
    <link rel="stylesheet" href="login_style.css">
</head>
<body class="auth-page">
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"></button>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-logo">
                    <i class="fas fa-lock"></i>
                </div>
                <h1>Reset Password</h1>
                <p>Enter a new secure password for your account</p>
            </div>

            <form id="resetPasswordForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="newPassword" class="form-input" placeholder="Enter new password" aria-label="New password">
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
                    </div>
                    <span class="error-message hidden" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password" aria-label="Confirm password">
                        <button type="button" id="toggleConfirmPassword" class="password-toggle" aria-label="Show confirm password"><i class="fas fa-eye"></i></button>
                    </div>
                    <span class="error-message hidden" id="confirmPasswordError"></span>
                </div>

                <div id="generalError" class="general-error hidden"></div>
                <div id="successMessage" class="success-message hidden"></div>

                <button type="button" id="resetButton" class="btn btn-primary btn-block btn-lg">
                    <span id="buttonText">Reset Password</span>
                    <span id="loadingSpinner" class="spinner-inline hidden"><i class="fas fa-spinner fa-spin"></i></span>
                </button>

                <div class="auth-footer">
                    <p><a href="Login.html" class="link-primary">Back to Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script src="reset_password.js"></script>
</body>
</html>
